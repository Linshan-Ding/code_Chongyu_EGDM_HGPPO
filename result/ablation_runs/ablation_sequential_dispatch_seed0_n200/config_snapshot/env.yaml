env:
  process_model: discrete_event_smdp

  decision_events:
    - ORDER_ARRIVAL
    - OPERATION_FINISH
    - RELOCATION_FINISH

  simultaneous_events: batch_before_decision
  due_date_is_decision_event: false
  expose_unreleased_orders_to_policy: false

  cell_capacity:
    max_workers: 1
    max_robots: 1

  operation_preemption: false
  hr_requires_synchronous_start: true
  relocation_only_when_idle: true
  relocation_resource_unavailable: true

  action_constraints:
    enforcement: hard_mask
    allow_reward_penalty_as_feasibility_substitute: false
    enforce_stage_cell_match: true
    enforce_order_release: true
    enforce_precedence: true
    enforce_resource_compatibility: true
    enforce_cell_capacity: true
    enforce_unique_usage_within_set_action: true
    enforce_basic_executable_coverage_after_reconfiguration: true

  reward:
    base: twt_integral
    verify_episode_identity: true
    # Paper Eq. (16)-(17) optional shaping is implemented in Phase L1.1.
    # Formal seeds remain blocked until eta is selected using validation only.
    optional_potential_shaping: false
    paper_allows_optional_potential_shaping: true
    potential_eta: null

  termination: all_required_operations_completed

  # ------------------------------------------------------------------
  # Phase E dynamic heterogeneous graph
  # ------------------------------------------------------------------
  graph:
    node_types: [operation, stage, cell, worker, robot]
    max_stages: 10
    continuous_normalization: training_distribution_zscore
    normalizer_min_std: 0.000001

    # Paper-unspecified feature formulas are explicit engineering choices.
    due_pressure_definition: normalized_slack_pressure
    load_capacity_definition: remaining_workload_over_current_service_cells
    include_resource_cell_candidate_edges: true
    include_reverse_relations: true
    include_same_stage_competition_edges: true

  # ------------------------------------------------------------------
  # Phase D implementation clarifications
  # ------------------------------------------------------------------
  # The paper permits a temporary unconfigured resource state but does not
  # define a separate physical pool location or pool-to-cell travel matrix.
  # Therefore an initially unconfigured resource is physically anchored beside
  # its first compatible cell, while not consuming that cell's configuration
  # capacity. Entering the unconfigured state later keeps the last physical cell.
  implementation_choices:
    initial_unconfigured_physical_anchor: first_compatible_cell
    unconfigure_keeps_physical_location: true

    # Initial configuration is treated as established at t=0, so the default
    # minimum dwell time is measured from t=0 before the first reconfiguration.
    initial_configuration_time: 0.0

    # To preserve non-preemptive execution and mode consistency, resources may
    # only be sent to currently idle target cells; a cell with an incoming
    # resource reservation cannot start an operation until relocation completes.
    reconfiguration_target_requires_idle_cell: true
    incoming_resource_reserves_capacity: true
    reserved_cell_cannot_start_processing: true

    # The paper requires retaining "basic executable coverage" but does not give
    # a formal formula. Phase D uses the conservative rule that every stage must
    # keep at least one currently configured compatible H or R resource after a
    # reconfiguration action; in-transit resources do not count as current supply.
    basic_coverage_rule: every_stage_has_current_compatible_resource

    # Due dates remain non-decision events. The reward integral is split
    # analytically at due-date crossings so that sum(base_reward) == -TWT exactly.
    due_date_reward_integration: exact_internal_crossing_without_policy_event
