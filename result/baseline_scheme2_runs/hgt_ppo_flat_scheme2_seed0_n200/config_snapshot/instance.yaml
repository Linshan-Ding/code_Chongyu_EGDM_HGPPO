instance:
  problem_name: egdm_hgppo_hrc_reconfiguration_scheduling

  parallel_cells_per_stage: [1, 3]
  min_multi_cell_stage_ratio: 0.30
  route_stage_coverage: [0.70, 1.00]

  scales:
    S:
      num_stages: 4
      total_cells: [5, 7]
      orders: [15, 35]
      workers: [3, 5]
      robots: [2, 4]
      product_types: [3, 3]
    M:
      num_stages: 6
      total_cells: [8, 12]
      orders: [40, 80]
      workers: [5, 8]
      robots: [4, 7]
      product_types: [4, 5]
    L:
      num_stages: 8
      total_cells: [12, 18]
      orders: [90, 160]
      workers: [8, 12]
      robots: [6, 10]
      product_types: [6, 8]
    XL:
      num_stages: 10
      total_cells: [18, 24]
      orders: [180, 300]
      workers: [12, 16]
      robots: [9, 13]
      product_types: [8, 10]

  base_process_time_minutes: [8.0, 25.0]
  worker_efficiency: [0.80, 1.20]
  robot_efficiency: [0.85, 1.30]
  hr_synergy_factor: [0.65, 0.90]

  worker_skill_density_choices: [0.60, 0.75, 0.90]
  robot_capability_density_choices: [0.50, 0.65, 0.80]
  hr_compatibility_rate: [0.70, 1.00]

  load_ratio_choices: [0.65, 0.80, 0.95]

  order_weight:
    values: [1, 2, 4]
    probabilities: [0.6, 0.3, 0.1]

  due_date_factor:
    tight: [1.3, 1.7]
    medium: [1.7, 2.1]
    loose: [2.1, 2.6]

  relocation_time_minutes:
    adjacent_cells: [1.0, 3.0]
    cross_stage: [3.0, 8.0]
    sensitivity_multiplier: [0.5, 2.0]

  minimum_dwell_time_minutes:
    candidates: [0.0, 5.0, 10.0]
    training_default: 5.0

  initial_configuration: load_balancing_heuristic_with_random_perturbation

  dynamic_scenarios:
    D1:
      name: steady
      arrival_process: stationary_poisson
      product_mix: fixed
      purpose: baseline_performance_and_scaling
    D2:
      name: arrival_burst
      arrival_process: mid_horizon_intensity_increase_50_to_100_percent
      product_mix: fixed
      purpose: response_to_short_term_backlog
    D3:
      name: product_mix_shift
      arrival_process: stationary
      product_mix: dominant_product_switch_A_to_B_mid_horizon
      purpose: adaptation_to_bottleneck_migration
    D4:
      name: dual_shock
      arrival_process: intensity_changes
      product_mix: two_structural_changes
      purpose: robustness_under_complex_dynamics
    D5:
      name: urgent_orders
      arrival_process: normal_flow_with_high_weight_batch
      product_mix: local_change
      purpose: due_date_weight_driven_response

  training_scales: [S, M, L]
  zero_shot_generalization_scale: XL

  evaluation_protocol:
    fixed_validation_instances: true
    fixed_test_instances: true
    # Advisor Scheme-2 fixes one immutable instance per design combination.
    test_instances_per_combination_min: 1
    small_scale_exact_reference: true

  # ------------------------------------------------------------------
  # Phase C implementation choices
  # ------------------------------------------------------------------
  # The paper specifies the qualitative dynamic scenarios and parameter
  # distributions, but does not prescribe these exact engineering values.
  # They are therefore explicit configuration, not hidden magic numbers.
  implementation_choices:
    # Approximate base Poisson rate:
    # lambda = rho * min(num_cells, H+R) / mean_minimum_route_work
    arrival_rate_calibration: work_content_over_effective_parallel_servers

    # Interpretation of Table 6 relocation ranges:
    # different cells of the same fixed stage use the adjacent-cell range;
    # cross-stage moves use the cross-stage range.
    same_stage_cells_are_adjacent: true

    # "load-balancing heuristic + random perturbation" magnitude is not
    # numerically specified in the paper.
    initial_configuration_perturbation_rate: 0.15

    # Dynamic-scenario changes are defined by order-sequence position because
    # the paper does not prescribe absolute horizon times.
    scenario_timing_basis: order_index_fraction
    base_product_mix: uniform

    d2_burst_start_ratio: 0.40
    d2_burst_end_ratio: 0.70
    d2_burst_multiplier: [1.50, 2.00]

    d3_mix_switch_ratio: 0.50
    d3_dominant_product_sequence: [0, 1]
    dominant_product_share: 0.70

    d4_change_ratios: [0.33, 0.67]
    d4_arrival_rate_multipliers: [1.00, 1.75, 1.25]
    d4_dominant_product_sequence: [0, 1, 2]

    d5_urgent_batch_fraction: 0.10
    d5_urgent_batch_center_ratio: 0.50
    d5_urgent_arrival_rate_multiplier: 3.00
    d5_urgent_dominant_product: 1
