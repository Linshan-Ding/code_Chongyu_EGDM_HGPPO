version: 1
semantics:
  S: assembly_stages
  M: total_assembly_cells
  R: robots
  J: orders
  H: workers
  V: product_types

# Controlled one-factor-at-a-time test suite. Dynamic conditions and companion
# resource dimensions stay fixed so the effect of S/M/R/J is not confounded.
# ``base_scale`` is the generator anchor; these are structural-effect tiers,
# not a claim that every out-of-range cell is an ordinary M-scale benchmark.
# Each design cell produces exactly one immutable CSV instance.
fixed_conditions:
  scale: M
  scenario: D1
  load_ratio: 0.80
  due_tightness: medium
  worker_skill_density: 0.75
  robot_capability_density: 0.65
  relocation_multiplier: 1.0

